# build.yml — release-bundle build on push to main + manual dispatch.
#
# Cross-OS signed builds and the GPU hardware matrix are validated in CI / on
# hardware, NOT locally. Each OS leg builds the ONE artefact v1 ships for that
# platform (Q7): Vulkan on Windows/Linux, Metal on macOS
# (architecture/cross-cutting.md "GPU portability"). Signing is parameterized:
# the build SUCCEEDS unsigned when the signing secrets are empty, and only
# signs / notarizes when they are present. This workflow uploads the bundles as
# build artifacts; it does NOT create a release (see release.yml for tags).
---
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: [self-hosted, linux, x64]
            features: vulkan
          - platform: windows
            os: windows-latest
            features: vulkan
          - platform: macos
            os: macos-latest
            features: metal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # All Linux build/bundle deps come from one script so the workflows, the
      # self-hosted runner image, and make ci-local cannot drift. This covers
      # the toolchain (clang/cmake/ninja), Tauri/WebKit, audio (libopus —
      # bypasses audiopus_sys's vendored CMake), AppImage bundling
      # (libfuse2/xdg-utils), and the Vulkan SDK incl. glslc. See the script
      # header for the full list. macOS/Windows handle their deps in the
      # per-OS steps below.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./ci/scripts/install-linux-deps.sh

      # Install the LunarG Vulkan SDK on Windows so llama.cpp CMake can find
      # glslc (required by FindVulkan.cmake). humbletim/setup-vulkan-sdk builds
      # components from source; its CMakeLists.txt does not recognise "shaderc"
      # as a buildable component (available: Vulkan-Headers, Vulkan-Loader,
      # SPIRV-Tools, Glslang — glslc is NOT included). The LunarG prebuilt
      # installer ships the complete SDK including glslc.exe at %VULKAN_SDK%\Bin\.
      # Pinned to 1.4.309.0 (latest available from sdk.lunarg.com as of 2026-06).
      # The installer is cached by actions/cache keyed on the pinned version so
      # re-runs do not re-download the ~250 MB exe.
      - name: Cache Vulkan SDK installer (Windows)
        if: runner.os == 'Windows'
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: windows-vulkan-sdk-1.4.309.0

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows' && steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "1.4.309.0"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          $installer = "$env:TEMP\VulkanSDK-Installer.exe"
          Write-Host "Downloading LunarG Vulkan SDK $version..."
          Invoke-WebRequest -Uri $url -OutFile $installer
          Write-Host "Installing (unattended)..."
          # LunarG's SDK installer is Qt IFW-based; the NSIS-style /S switch
          # is silently ignored (nothing installs). The IFW unattended form
          # installs the core SDK, which includes Bin\glslc.exe.
          Start-Process -FilePath $installer -ArgumentList @(
            "--accept-licenses", "--default-answer", "--confirm-command", "install"
          ) -Wait
          if (-not (Test-Path "C:\VulkanSDK\$version\Bin\glslc.exe")) {
            Write-Error "glslc.exe not found after install; aborting"
            exit 1
          }

      - name: Set VULKAN_SDK env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.4.309.0"
          $sdk = "C:\VulkanSDK\$version"
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # llama.cpp's vulkan-shaders-gen nested CMake sub-build fails under the
      # MSBuild/Visual Studio generator ("could not load cache" / "cannot find
      # batch label VCEnd"); Ninja sidesteps the .vcxproj custom-build-rule
      # machinery. windows-latest ships Ninja preinstalled. Mirrors the same
      # workaround in scripts/build-windows-app.ps1 for local builds.
      - name: Set CMAKE_GENERATOR (Windows)
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$env:GITHUB_ENV"
        shell: pwsh

      # audiopus_sys v0.2.2's bundled opus CMake tree requires
      # cmake_minimum_required >= 3.5; CMake 3.27+ rejects older declarations.
      # Installing system Opus bypasses the vendored CMake build via pkg-config.
      #
      # The macOS runner image ships only Xcode's bundled clang, not Homebrew's
      # llvm keg — bindgen (via llama-cpp-sys-2's build script) needs the
      # latter's libclang.dylib, so it's installed explicitly here.
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install opus llvm

      - name: Install Windows system dependencies (Opus)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install opus:x64-windows-static
          $libDir = "C:\vcpkg\installed\x64-windows-static"
          "LIBOPUS_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBOPUS_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # sherpa-rs and ort download prebuilt shared libraries at build time into
      # platform-specific cache dirs outside the cargo target tree.
      #
      # sherpa-rs-sys (via dirs::cache_dir()):
      #   Linux:   ~/.cache/sherpa-rs
      #   macOS:   ~/Library/Caches/sherpa-rs
      #   Windows: ~/AppData/Local/sherpa-rs   (LOCALAPPDATA)
      #
      # ort-sys (via its internal dirs module):
      #   Linux:   ~/.cache/ort.pyke.io
      #   macOS:   ~/Library/Caches/ort.pyke.io
      #   Windows: ~/AppData/Local/ort.pyke.io
      #
      # When a cargo cache hit restores compiled artifacts whose link-search
      # paths reference these dirs, the linker fails if the files are absent.
      # Including them ties their lifetime to the cargo cache key. Non-existent
      # paths are silently skipped by the action.
      - name: Cache cargo build + registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/.cache/ort.pyke.io
            ~/Library/Caches/sherpa-rs
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/sherpa-rs
            ~/AppData/Local/ort.pyke.io

      # GPU feature-graph guard for the backends NOT bundled on this leg
      # (cuda/rocm everywhere). The bundled backend (vulkan/metal,
      # matrix.features) is already validated by the build below; these
      # toolkits aren't installed on the runner, so we only resolve the
      # feature graph via `cargo tree -e features`, which expands every
      # inter-crate feature-forward edge and fails if one is missing/renamed —
      # without compiling any GPU kernel. This makes a broken feature-forward
      # fail CI on push to main even for unbuilt backends.
      - name: Validate GPU feature graph (unbundled backends)
        shell: bash
        run: |
          set -euo pipefail
          graph_features="cuda rocm"
          for feat in $graph_features; do
            echo "::group::cargo tree -e features --features $feat"
            cargo tree -p minutist --no-default-features \
              --features "$feat" -e features --locked
            echo "::endgroup::"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set LIBCLANG_PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvm)) {
            $llvm = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # Conditionally export signing env vars: tauri (not tauri-action) reads
      # these from the process environment and treats any non-empty value as
      # "signing requested". GitHub Actions always exports env: variables, even
      # as empty strings, and Rust's std::env::var returns Some("") for an
      # empty-string env var — which is truthy in a let-Some binding. Setting
      # the variables only when the secret is actually populated means tauri
      # sees them absent (rather than present-but-empty) when secrets are unset,
      # so the build completes unsigned instead of attempting a keychain import
      # with an empty certificate. The same guard covers Windows Authenticode
      # and the updater private key.
      - name: Prepare signing env
        shell: bash
        run: |
          set_if_nonempty() {
            local name="$1" val="$2"
            if [ -n "$val" ]; then
              printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
            fi
          }
          set_if_nonempty TAURI_SIGNING_PRIVATE_KEY        "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          set_if_nonempty TAURI_SIGNING_PRIVATE_KEY_PASSWORD "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          set_if_nonempty WINDOWS_CERTIFICATE               "${{ secrets.WINDOWS_CERTIFICATE }}"
          set_if_nonempty WINDOWS_CERTIFICATE_PASSWORD      "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"
          set_if_nonempty APPLE_CERTIFICATE                 "${{ secrets.APPLE_CERTIFICATE }}"
          set_if_nonempty APPLE_CERTIFICATE_PASSWORD        "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
          set_if_nonempty APPLE_SIGNING_IDENTITY            "${{ secrets.APPLE_SIGNING_IDENTITY }}"
          set_if_nonempty APPLE_ID                          "${{ secrets.APPLE_ID }}"
          set_if_nonempty APPLE_PASSWORD                    "${{ secrets.APPLE_PASSWORD }}"
          set_if_nonempty APPLE_TEAM_ID                     "${{ secrets.APPLE_TEAM_ID }}"

      # Warm the sherpa/onnxruntime caches and export the loader path so
      # linuxdeploy embeds those libs in the AppImage. Shared with release.yml
      # via the composite action so the two workflows cannot drift; see
      # .github/actions/linux-bundle-prep/action.yml.
      - name: Linux bundle prep
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-bundle-prep
        with:
          features: ${{ matrix.features }}

      # Clear any stale bundle output from a prior build on this (persistent,
      # self-hosted) runner so the upload captures only THIS run's artifacts —
      # e.g. a pre-#0013 deb/rpm whose .sig the broad upload glob would sweep in.
      # Removes only the bundler OUTPUT dir; the cargo compile cache under
      # target/release/ is untouched. macOS/Windows runners are ephemeral, so
      # this is Linux-only.
      - name: Clear stale bundle output
        if: runner.os == 'Linux'
        run: rm -rf target/release/bundle

      # tauri-action runs the configured beforeBuildCommand (npm run build) and
      # bundles the app. `--features <gpu>` selects the single per-platform GPU
      # backend. Signing vars are set in the "Prepare signing env" step above
      # only when the corresponding secrets are populated, so the build completes
      # unsigned (and logs "unsigned bundle") when secrets are absent.
      - name: Build release bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri
          args: --verbose --features ${{ matrix.features }}

      # Collect every bundle tauri-action produced for this OS. The bundle
      # output lives under the workspace target dir; glob broadly so we capture
      # .AppImage (Linux — the sole Linux target), .msi/.exe (Windows),
      # .app/.dmg (macOS).
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app/**
            target/release/bundle/**/*.sig
            target/release/bundle/**/*.tar.gz
            target/release/bundle/**/*.zip
            !target/release/bundle/deb/**
            !target/release/bundle/rpm/**

  # Free-tier build: --no-default-features omits mcp-server/rmcp.
  # Linux-only at this stage to contain runner costs (the connected matrix
  # already builds all 3 platforms; the free variant exercises the feature
  # flag but does not need a per-platform signing matrix for validation).
  # If a free-tier release is shipped on all platforms, extend this matrix
  # to mirror the connected `build` job above.
  #
  # VITE_CONNECTED is set at the job level so every step — including the
  # npm build that tauri-action runs via beforeBuildCommand — inherits it.
  # The verify step runs after tauri-action so it inspects the dist that
  # was actually bundled (tauri-action overwrites the dist built manually).
  build-free:
    name: build-free (linux)
    runs-on: [self-hosted, linux, x64]
    env:
      VITE_CONNECTED: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source for all Linux build/bundle deps (see install-linux-deps.sh).
      # This job is linux-only, so no runner.os guard is needed.
      - name: Install Linux build dependencies
        run: ./ci/scripts/install-linux-deps.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build + registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/.cache/ort.pyke.io

      - name: Set LIBCLANG_PATH (Linux)
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # Pre-build the free UI bundle so it exists before tauri-action runs.
      # VITE_CONNECTED="" is inherited from the job env — McpSettingsPane and its
      # mcp-settings/mcp-server-info state modules are tree-shaken out.
      - name: Build free UI bundle
        working-directory: ui
        run: npm run build

      # linuxdeploy (AppImage) needs APPIMAGE_EXTRACT_AND_RUN=1 on GitHub Actions
      # because /dev/fuse is not available — same reason as the connected build.
      - name: Set APPIMAGE_EXTRACT_AND_RUN
        run: echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      # Build the free Rust artifact. --no-default-features drops mcp-server/
      # rmcp; --features vulkan adds the GPU backend (Vulkan is available on
      # the ubuntu-latest runner via the SDK installed above).
      # tauri-action re-runs beforeBuildCommand (npm run build) from tauri.conf.json;
      # it inherits VITE_CONNECTED="" from the job env so the free UI is bundled.
      # Pre-build for the same cold-cache reason as the connected leg: the
      # lib-path export must run after the sherpa/onnxruntime downloads exist.
      - name: Pre-build (free)
        run: cargo build --release --no-default-features --features vulkan --locked

      # linuxdeploy resolves the binary's dynamic dependencies while bundling;
      # the sherpa-onnx / onnxruntime shared libraries live in the build-time
      # download caches, not on the default loader path. Exporting them lets
      # linuxdeploy find AND EMBED them in the AppImage (required for the
      # artifact to run on user machines).
      - name: Export sherpa-rs lib path (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for d in ~/.cache/sherpa-rs/x86_64-unknown-linux-gnu/*/*/lib ~/.cache/ort.pyke.io/dfbin/x86_64-unknown-linux-gnu/*/onnxruntime/lib; do
            if [ -d "$d" ]; then
              echo "LD_LIBRARY_PATH=${d}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
              export LD_LIBRARY_PATH="${d}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            fi
          done

      # Clear stale bundle output (see the connected build job above). This job
      # is Linux-only and runs on the persistent self-hosted runner.
      - name: Clear stale bundle output
        run: rm -rf target/release/bundle

      - name: Build free release bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri
          args: --verbose -- --no-default-features --features vulkan

      # Verify the MCP pane token-reveal label is absent from the dist that
      # tauri-action actually bundled (runs after tauri-action, not before).
      - name: Verify free bundle excludes MCP pane
        shell: bash
        run: |
          if grep -r "Enable MCP server" ui/dist/; then
            echo "ERROR: MCP pane string found in free bundle"
            exit 1
          fi
          echo "PASS: MCP pane absent from free bundle"

      - name: Upload free bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-linux-free
          if-no-files-found: error
          retention-days: 7
          path: |
            target/release/bundle/**/*.AppImage
