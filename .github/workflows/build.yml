# build.yml — release-bundle build on push to main + manual dispatch.
#
# Cross-OS signed builds and the GPU hardware matrix are validated in CI / on
# hardware, NOT locally. Each OS leg builds the ONE artefact v1 ships for that
# platform (Q7): Vulkan on Windows/Linux, Metal on macOS
# (architecture/cross-cutting.md "GPU portability"). Signing is parameterized:
# the build SUCCEEDS unsigned when the signing secrets are empty, and only
# signs / notarizes when they are present. This workflow uploads the bundles as
# build artifacts; it does NOT create a release (see release.yml for tags).
---
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            features: vulkan
          - platform: windows
            os: windows-latest
            features: vulkan
          - platform: macos
            os: macos-latest
            features: metal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # libopus-dev: audiopus_sys v0.2.2 bundles an opus CMake tree whose
      # cmake_minimum_required is < 3.5, which CMake 3.27+ rejects.  Installing
      # the system libopus lets pkg-config satisfy the dep and bypass the
      # vendored CMake build.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libopus-dev

      # Vulkan loader/headers + shaderc (provides glslc) for the `vulkan`
      # feature on Linux. glslang-tools alone does not provide glslc, and
      # llama.cpp's CMake uses FindVulkan which requires glslc specifically.
      # macOS uses Metal (built into the OS). Windows runners ship the Vulkan
      # loader; the full SDK (with glslc) is installed below via the LunarG
      # installer so llama.cpp CMake can find it.
      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libvulkan-dev glslang-tools shaderc

      # Install the LunarG Vulkan SDK on Windows so llama.cpp CMake can
      # find glslc (required by FindVulkan.cmake). The runner ships the Vulkan
      # loader but not the full SDK tools.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Glslang
          vulkan-use-cache: true

      # audiopus_sys v0.2.2's bundled opus CMake tree requires
      # cmake_minimum_required >= 3.5; CMake 3.27+ rejects older declarations.
      # Installing system Opus bypasses the vendored CMake build via pkg-config.
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install opus

      - name: Install Windows system dependencies (Opus)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install opus:x64-windows-static
          $libDir = "C:\vcpkg\installed\x64-windows-static\lib"
          "LIBOPUS_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBOPUS_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build + registry
        uses: Swatinem/rust-cache@v2

      # GPU feature-graph guard for the backends NOT bundled on this leg
      # (cuda/rocm everywhere; directml on Windows — sherpa's DirectML backend).
      # The bundled backend (vulkan/metal, matrix.features) is already validated
      # by the build below; these toolkits aren't installed on the runner, so we
      # only resolve the feature graph via `cargo tree -e features`, which
      # expands every inter-crate feature-forward edge and fails if one is
      # missing/renamed — without compiling any GPU kernel. This makes a broken
      # feature-forward fail CI on push to main even for unbuilt backends.
      - name: Validate GPU feature graph (unbundled backends)
        shell: bash
        run: |
          set -euo pipefail
          graph_features="cuda rocm"
          if [ "${{ runner.os }}" = "Windows" ]; then
            graph_features="cuda rocm directml"
          fi
          for feat in $graph_features; do
            echo "::group::cargo tree -e features --features $feat"
            cargo tree -p minutist --no-default-features \
              --features "$feat" -e features --locked
            echo "::endgroup::"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set LIBCLANG_PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "LIBCLANG_PATH=$(brew --prefix llvm@18 2>/dev/null || brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvm)) {
            $llvm = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # tauri-action runs the configured beforeBuildCommand (npm run build) and
      # bundles the app. `--features <gpu>` selects the single per-platform GPU
      # backend. Signing happens only when the corresponding env is populated:
      #   - Updater signing:    TAURI_SIGNING_PRIVATE_KEY (+ password)
      #   - Windows code sign:  WINDOWS_CERTIFICATE (+ password)
      #   - macOS notarization: APPLE_* family
      # When a secret is unset GitHub injects an empty string, which tauri-action
      # treats as "not configured" and skips that signing step — so the build
      # still succeeds unsigned. Empty secrets are normal on this workflow.
      - name: Build release bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater signing (tauri-plugin-updater). Empty => unsigned bundle.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows Authenticode (base64 PFX + password). Empty => unsigned .exe/.msi.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Apple notarization. Empty => unsigned, un-notarized .app/.dmg.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: src-tauri
          args: --features ${{ matrix.features }}

      # Collect every bundle tauri-action produced for this OS. The bundle
      # output lives under the workspace target dir; glob broadly so we capture
      # .deb/.AppImage/.rpm (Linux), .msi/.exe (Windows), .app/.dmg (macOS).
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app/**
            target/release/bundle/**/*.sig
            target/release/bundle/**/*.tar.gz
            target/release/bundle/**/*.zip

  # Free-tier build: --no-default-features omits mcp-server/rmcp.
  # Linux-only at this stage to contain runner costs (the connected matrix
  # already builds all 3 platforms; the free variant exercises the feature
  # flag but does not need a per-platform signing matrix for validation).
  # If a free-tier release is shipped on all platforms, extend this matrix
  # to mirror the connected `build` job above.
  #
  # VITE_CONNECTED is set at the job level so every step — including the
  # npm build that tauri-action runs via beforeBuildCommand — inherits it.
  # The verify step runs after tauri-action so it inspects the dist that
  # was actually bundled (tauri-action overwrites the dist built manually).
  build-free:
    name: build-free (linux)
    runs-on: ubuntu-latest
    env:
      VITE_CONNECTED: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libopus-dev

      - name: Install Vulkan SDK (Linux)
        run: |
          sudo apt-get install -y libvulkan-dev glslang-tools shaderc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build + registry
        uses: Swatinem/rust-cache@v2

      - name: Set LIBCLANG_PATH (Linux)
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # Pre-build the free UI bundle so it exists before tauri-action runs.
      # VITE_CONNECTED="" is inherited from the job env — McpSettingsPane and its
      # mcp-settings/mcp-server-info state modules are tree-shaken out.
      - name: Build free UI bundle
        working-directory: ui
        run: npm run build

      # Build the free Rust artifact. --no-default-features drops mcp-server/
      # rmcp; --features vulkan adds the GPU backend (Vulkan is available on
      # the ubuntu-latest runner via the SDK installed above).
      # tauri-action re-runs beforeBuildCommand (npm run build) from tauri.conf.json;
      # it inherits VITE_CONNECTED="" from the job env so the free UI is bundled.
      - name: Build free release bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri
          args: -- --no-default-features --features vulkan

      # Verify the MCP pane token-reveal label is absent from the dist that
      # tauri-action actually bundled (runs after tauri-action, not before).
      - name: Verify free bundle excludes MCP pane
        shell: bash
        run: |
          if grep -r "Enable MCP server" ui/dist/; then
            echo "ERROR: MCP pane string found in free bundle"
            exit 1
          fi
          echo "PASS: MCP pane absent from free bundle"

      - name: Upload free bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundle-linux-free
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.rpm
