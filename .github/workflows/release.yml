# release.yml — signed release-bundle build + GitHub Release on `v*` tags.
#
# Cross-OS signed builds and the GPU hardware matrix are validated in CI / on
# hardware, NOT locally. Each OS leg builds the ONE artefact v1 ships for that
# platform (Q7): Vulkan on Windows/Linux, Metal on macOS. tauri-action creates
# (or reuses) the GitHub Release named after the tag, attaches each platform's
# signed bundle, and — with includeUpdaterJson — publishes the
# tauri-plugin-updater `latest.json` manifest.
#
# Signing is gated on secrets being present:
#   - Updater signing requires TAURI_SIGNING_PRIVATE_KEY; without it the
#     updater .sig files (and a meaningful latest.json) cannot be produced.
#   - Windows Authenticode / Apple notarization apply only when their secrets
#     are populated; an empty secret is treated as "not configured" and that
#     signing step is skipped, so the build still completes (unsigned for that
#     platform). For a real release these secrets are expected to be set.
---
name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# tauri-action needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: [self-hosted, linux, x64]
            features: vulkan
          - platform: windows
            os: windows-latest
            features: vulkan
          - platform: macos
            os: macos-latest
            features: metal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # All Linux build/bundle deps from the single source — including
      # libfuse2/xdg-utils (AppImage runtime) and the Vulkan SDK with glslc.
      # See ci/scripts/install-linux-deps.sh.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./ci/scripts/install-linux-deps.sh

      # Install the LunarG Vulkan SDK on Windows so llama.cpp CMake can find
      # glslc (required by FindVulkan.cmake). humbletim/setup-vulkan-sdk builds
      # components from source; its CMakeLists.txt does not recognise "shaderc"
      # as a buildable component (available: Vulkan-Headers, Vulkan-Loader,
      # SPIRV-Tools, Glslang — glslc is NOT included). The LunarG prebuilt
      # installer ships the complete SDK including glslc.exe at %VULKAN_SDK%\Bin\.
      # Pinned to 1.4.309.0 (latest available from sdk.lunarg.com as of 2026-06).
      # The installer is cached by actions/cache keyed on the pinned version so
      # re-runs do not re-download the ~250 MB exe.
      - name: Cache Vulkan SDK installer (Windows)
        if: runner.os == 'Windows'
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: windows-vulkan-sdk-1.4.309.0

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows' && steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "1.4.309.0"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          $installer = "$env:TEMP\VulkanSDK-Installer.exe"
          Write-Host "Downloading LunarG Vulkan SDK $version..."
          Invoke-WebRequest -Uri $url -OutFile $installer
          Write-Host "Installing (unattended)..."
          # LunarG's SDK installer is Qt IFW-based; the NSIS-style /S switch
          # is silently ignored (nothing installs). The IFW unattended form
          # installs the core SDK, which includes Bin\glslc.exe.
          Start-Process -FilePath $installer -ArgumentList @(
            "--accept-licenses", "--default-answer", "--confirm-command", "install"
          ) -Wait
          if (-not (Test-Path "C:\VulkanSDK\$version\Bin\glslc.exe")) {
            Write-Error "glslc.exe not found after install; aborting"
            exit 1
          }

      - name: Set VULKAN_SDK env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.4.309.0"
          $sdk = "C:\VulkanSDK\$version"
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # llama.cpp's vulkan-shaders-gen nested CMake sub-build fails under the
      # MSBuild/Visual Studio generator ("could not load cache" / "cannot find
      # batch label VCEnd"); Ninja sidesteps the .vcxproj custom-build-rule
      # machinery. windows-latest ships Ninja preinstalled. Mirrors the same
      # workaround in scripts/build-windows-app.ps1 for local builds.
      - name: Set CMAKE_GENERATOR (Windows)
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> "$env:GITHUB_ENV"
        shell: pwsh

      # audiopus_sys v0.2.2's bundled opus CMake tree requires
      # cmake_minimum_required >= 3.5; CMake 3.27+ rejects older declarations.
      # Installing system Opus bypasses the vendored CMake build via pkg-config.
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install opus

      - name: Install Windows system dependencies (Opus)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install opus:x64-windows-static
          $libDir = "C:\vcpkg\installed\x64-windows-static"
          "LIBOPUS_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBOPUS_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build + registry
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set LIBCLANG_PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "LIBCLANG_PATH=$(brew --prefix llvm@18 2>/dev/null || brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvm)) {
            $llvm = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # Conditionally export signing env vars. tauri reads these from the
      # process environment; any non-empty value triggers the signing path.
      # GitHub Actions always exports env: variables even as empty strings, and
      # std::env::var returns Some("") which is truthy in a let-Some binding.
      # This step sets variables only when the secret is actually populated,
      # so an absent secret leaves the env var unset rather than empty.
      # For release builds the signing secrets are expected to be present, but
      # the guard prevents an accidental "empty secret configured" from breaking
      # the build rather than silently producing an unsigned artefact.
      - name: Prepare signing env
        shell: bash
        run: |
          set_if_nonempty() {
            local name="$1" val="$2"
            if [ -n "$val" ]; then
              printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
            fi
          }
          set_if_nonempty TAURI_SIGNING_PRIVATE_KEY        "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          set_if_nonempty TAURI_SIGNING_PRIVATE_KEY_PASSWORD "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          set_if_nonempty WINDOWS_CERTIFICATE               "${{ secrets.WINDOWS_CERTIFICATE }}"
          set_if_nonempty WINDOWS_CERTIFICATE_PASSWORD      "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}"
          set_if_nonempty APPLE_CERTIFICATE                 "${{ secrets.APPLE_CERTIFICATE }}"
          set_if_nonempty APPLE_CERTIFICATE_PASSWORD        "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
          set_if_nonempty APPLE_SIGNING_IDENTITY            "${{ secrets.APPLE_SIGNING_IDENTITY }}"
          set_if_nonempty APPLE_ID                          "${{ secrets.APPLE_ID }}"
          set_if_nonempty APPLE_PASSWORD                    "${{ secrets.APPLE_PASSWORD }}"
          set_if_nonempty APPLE_TEAM_ID                     "${{ secrets.APPLE_TEAM_ID }}"

      # Warm the sherpa/onnxruntime caches and export the loader path so
      # linuxdeploy embeds those libs in the published AppImage. Without this the
      # downloaded artefact's loader cannot resolve libsherpa-onnx-c-api.so and
      # fails to start on a clean machine. Shared with build.yml via the
      # composite action so the two workflows cannot drift; see
      # .github/actions/linux-bundle-prep/action.yml.
      - name: Linux bundle prep
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-bundle-prep
        with:
          features: ${{ matrix.features }}

      # Build + sign + bundle, then create/attach to the GitHub Release named
      # after the pushed tag. includeUpdaterJson:true emits latest.json so
      # tauri-plugin-updater clients can pull this release. Signing vars are
      # set in the "Prepare signing env" step above only when the corresponding
      # secrets are populated.
      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --features ${{ matrix.features }}
          # The pushed tag, e.g. refs/tags/v1.2.3 -> v1.2.3.
          tagName: ${{ github.ref_name }}
          releaseName: "minutist ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
