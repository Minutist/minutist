# test.yml — workspace + UI test matrix on push / PR.
#
# Cross-OS execution and the GPU hardware matrix are validated in CI / on
# hardware, NOT locally: this file is authored on Linux and its Windows and
# macOS legs only ever run on GitHub-hosted runners. The default build here is
# CPU-only (no GPU feature flags); the GPU portability matrix is exercised in
# build.yml / on hardware, per architecture/cross-cutting.md "GPU portability".
---
name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # REUSE / licence-metadata gate: REUSE.toml must stay spec-valid and every
  # referenced licence must exist under LICENSES/. Keeps the licence map from
  # silently drifting (e.g. a new top-level dir of brand assets falling under
  # the code licence by accident).
  reuse-lint:
    name: reuse lint
    # Fork-PR guard: keep untrusted fork PRs off the self-hosted runner (ci/runner/),
    # which shares hosts with production. Runs for push/dispatch and same-repo PRs only.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: reuse lint
        uses: fsfe/reuse-action@v5

  # Mechanical architecture guardrails (see architecture/cross-cutting.md —
  # "Logging" / the dependency-table note): the components.md dependency
  # table against every Cargo.toml, and the tracing target: convention. Same
  # two checks the pre-commit hook runs on the working tree; here they run
  # against the checked-out commit.
  guardrails:
    name: guardrails (dep-table, tracing-targets)
    # Fork-PR guard: keep untrusted fork PRs off the self-hosted runner (this job
    # runs attacker-controllable scripts from the checked-out tree).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Dependency-table check
        run: uv run scripts/check-dep-table.py
      - name: Tracing-target check
        run: uv run scripts/check-tracing-targets.py

  test:
    name: test (${{ matrix.os }})
    # Fork-PR guard: the Linux leg of this matrix runs on the self-hosted runner,
    # so gate the whole job off fork PRs. (Trade-off: fork PRs get no CI here; a
    # later refinement can keep the GitHub-hosted windows/macOS legs for forks.)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux runs on the repo's self-hosted runner (ci/runner/) — free and
        # fast; Windows/macOS stay on GitHub-hosted images.
        os: [[self-hosted, linux, x64], windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # All Linux build deps from the single source (see install-linux-deps.sh):
      # WebKit/Tauri, the build toolchain, audio (libopus bypasses
      # audiopus_sys's vendored CMake), and the rest. Only the Linux leg uses
      # it; Windows and macOS ship the webview with the OS and handle their
      # deps in the per-OS steps below.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./ci/scripts/install-linux-deps.sh

      # audiopus_sys v0.2.2 bundles an opus CMake tree whose
      # cmake_minimum_required is < 3.5, which CMake 3.27+ rejects. Installing
      # the system Opus library lets pkg-config satisfy the dep and skip the
      # vendored CMake build.
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install opus

      # Install Opus via vcpkg on Windows. vcpkg is pre-installed on
      # windows-latest at C:\vcpkg. opus:x64-windows-static provides the
      # static lib that audiopus_sys needs; LIBOPUS_LIB_DIR + LIBOPUS_STATIC
      # tell the audiopus_sys build script where to find it, bypassing the
      # vendored CMake build.
      - name: Install Windows system dependencies (Opus)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install opus:x64-windows-static
          $libDir = "C:\vcpkg\installed\x64-windows-static"
          "LIBOPUS_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBOPUS_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # sherpa-rs and ort download prebuilt shared libraries at build time into
      # platform-specific cache dirs outside the cargo target tree.
      #
      # sherpa-rs-sys (via dirs::cache_dir()):
      #   Linux:   ~/.cache/sherpa-rs
      #   macOS:   ~/Library/Caches/sherpa-rs
      #   Windows: ~/AppData/Local/sherpa-rs   (LOCALAPPDATA)
      #
      # ort-sys (via ORT_CACHE_DIR or its internal dirs module):
      #   Linux:   ~/.cache/ort.pyke.io
      #   macOS:   ~/Library/Caches/ort.pyke.io
      #   Windows: ~/AppData/Local/ort.pyke.io
      #
      # When a cargo cache hit restores compiled artifacts whose link-search
      # paths reference these dirs, the linker (and the runtime loader) fails if
      # the .so/.dylib/.dll files are absent. Including them ties their lifetime
      # to the cargo cache key. Non-existent paths are silently skipped.
      - name: Cache cargo build + registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/.cache/ort.pyke.io
            ~/Library/Caches/sherpa-rs
            ~/Library/Caches/ort.pyke.io
            ~/AppData/Local/sherpa-rs
            ~/AppData/Local/ort.pyke.io

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # bindgen (llama-cpp-2, libsql) needs libclang. The path differs per OS;
      # set it explicitly so the build does not depend on auto-discovery.
      - name: Set LIBCLANG_PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "LIBCLANG_PATH=$(brew --prefix llvm@18 2>/dev/null || brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      # windows-latest ships LLVM under the Chocolatey path; fall back to the
      # standard install location if the env var is unset.
      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvm)) {
            $llvm = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      # Export runtime library search paths so test binaries can dlopen
      # sherpa-onnx shared libs when the cargo build script was skipped on a
      # cache hit. The build script copies libs into target/.../deps/ on first
      # build, but that copy is absent if only the compiled artifacts were
      # restored from cache. The glob finds the versioned subdirectory without
      # hardcoding the hash, and exports the path via GITHUB_ENV so it persists
      # to the cargo test step.
      - name: Export sherpa-rs lib path (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          lib=$(ls -d ~/.cache/sherpa-rs/x86_64-unknown-linux-gnu/*/*/lib 2>/dev/null | head -1 || true)
          if [ -n "$lib" ]; then
            echo "LD_LIBRARY_PATH=${lib}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Export sherpa-rs lib path (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          lib=$(ls -d ~/Library/Caches/sherpa-rs/aarch64-apple-darwin/*/*/lib 2>/dev/null | head -1 || true)
          if [ -n "$lib" ]; then
            echo "DYLD_FALLBACK_LIBRARY_PATH=${lib}${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Export sherpa-rs lib path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "$env:LOCALAPPDATA\sherpa-rs"
          $lib = Get-ChildItem -Path $root -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty DirectoryName
          if ($lib) {
            "$lib" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      # Linux: the shared script runs cargo test + UI build + UI test in one
      # step, keeping the commands in sync with `make ci-local`.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ci/scripts/run-linux-tests.sh

      # Windows/macOS: run steps individually (Windows needs DLL staging; macOS
      # can share the plain steps).
      #
      # CPU-only workspace tests. sherpa-rs pulls its prebuilt libs via the
      # `download-binaries` feature on first build (network access required).
      #
      # Windows: build first, then copy the sherpa/onnxruntime DLLs next to the
      # test executables. Windows DLL search resolves the application directory
      # before PATH, and the runner image ships an older onnxruntime.dll in
      # System32 that wins over PATH entries and lacks the C-API exports our
      # build links (STATUS_ENTRYPOINT_NOT_FOUND at process start). Staging the
      # correct DLLs beside the exes is the only placement that always wins.
      - name: Build tests (Windows)
        if: runner.os == 'Windows'
        run: cargo build --workspace --tests --locked

      - name: Stage sherpa/onnxruntime DLLs beside test executables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = "target\debug\deps"
          $sources = @("$env:LOCALAPPDATA\sherpa-rs", "$env:LOCALAPPDATA\ort.pyke.io", "target\debug")
          foreach ($root in $sources) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
                Where-Object { $_.DirectoryName -ne (Resolve-Path $deps -ErrorAction SilentlyContinue).Path } |
                ForEach-Object { Copy-Item $_.FullName -Destination $deps -Force -ErrorAction SilentlyContinue }
            }
          }
          Get-ChildItem -Path $deps -Filter "*.dll" | Select-Object -ExpandProperty Name

      - name: cargo test --workspace
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked

      - name: Install UI dependencies
        if: runner.os != 'Linux'
        working-directory: ui
        run: npm ci

      - name: Build UI
        if: runner.os != 'Linux'
        working-directory: ui
        run: npm run build

      - name: Test UI
        if: runner.os != 'Linux'
        working-directory: ui
        run: npm run test

      # npm audit: report high/critical findings.  Non-blocking (|| true) because
      # the critical finding (GHSA-67mh-4wv8-2f99, esbuild dev-server) affects the
      # Vite dev server only and requires a breaking vite@8 bump to fix.  The audit
      # step surfaces NEW findings in PR review output without blocking merges.
      - name: npm audit
        working-directory: ui
        run: npm audit --audit-level=high || true

  # cargo-deny: licence, advisory, ban, and source checks on every PR/push.
  # Runs only on Linux (the lock file is cross-platform; no OS-specific crates
  # are skipped).
  cargo-deny:
    name: cargo deny
    # Fork-PR guard: keep untrusted fork PRs off the self-hosted runner (this job
    # spawns a container action through the host docker socket).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace

  # GPU feature-graph gate. The CPU `test` job above never enables a GPU
  # feature, and build.yml only builds vulkan/metal (and only on push to main),
  # so a broken feature-forward (e.g. a renamed/typo'd asr-runtime/vulkan edge,
  # or a cuda/rocm fan-out that no longer resolves) could merge green.
  #
  # This job validates the FULL GPU feature graph on every PR. For each backend
  # we resolve `cargo tree -e features`, which expands every inter-crate
  # feature-forward edge and exits non-zero if any edge is missing/renamed —
  # WITHOUT invoking the C++/CUDA/ROCm build scripts, so it needs no GPU
  # toolkit installed. vulkan (Linux) and metal (macOS) are then additionally
  # `cargo check`ed because their toolchain is present on the runner,
  # validating the build-script/link path too.
  #
  # cuda/rocm (NVIDIA/AMD toolkits absent) and Windows vulkan (Vulkan SDK with
  # glslc absent on windows-latest runners — the loader is present but
  # llama.cpp CMake requires glslc from the full SDK) are graph-only: the goal
  # is that a broken feature-forward fails CI, not a full kernel build.
  # Windows vulkan is validated end-to-end by build.yml on push to main.
  gpu-features:
    name: gpu-features (${{ matrix.os }})
    # Fork-PR guard: the Linux leg of this matrix runs on the self-hosted runner,
    # so gate the whole job off fork PRs. (Trade-off as in `test`: fork PRs get no
    # CI here; a later refinement can keep the GitHub-hosted legs for forks.)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: vulkan SDK (including glslc from shaderc) installed ->
          # full check; cuda/rocm graph-only. Self-hosted (ci/runner/).
          - os: [self-hosted, linux, x64]
            check_features: vulkan
            graph_features: cuda rocm
          # macOS: metal is in the OS -> full check. (cuda/rocm N/A.)
          - os: macos-latest
            check_features: metal
            graph_features: ""
          # Windows: Vulkan SDK (full SDK with glslc) not present on
          # windows-latest runners, so vulkan is graph-only here. cuda, rocm
          # also graph-only. Windows vulkan is fully checked in build.yml on
          # push to main.
          - os: windows-latest
            check_features: ""
            graph_features: cuda rocm vulkan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source for all Linux build/bundle deps, including the Vulkan SDK
      # (libvulkan-dev/glslang-tools/glslc) used by the `vulkan` cargo check.
      # See ci/scripts/install-linux-deps.sh.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./ci/scripts/install-linux-deps.sh

      # audiopus_sys v0.2.2's bundled opus CMake tree requires
      # cmake_minimum_required >= 3.5; CMake 3.27+ rejects older declarations.
      # Installing the system Opus library lets pkg-config satisfy the dep and
      # bypass the vendored CMake build.
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install opus

      - name: Install Windows system dependencies (Opus)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install opus:x64-windows-static
          $libDir = "C:\vcpkg\installed\x64-windows-static"
          "LIBOPUS_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBOPUS_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # sherpa-rs and ort download prebuilt shared libraries at build time into
      # platform-specific cache dirs outside the cargo target tree. See the
      # same note in the test job's rust-cache step for the full explanation.
      - name: Cache cargo build + registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/.cache/ort.pyke.io
            ~/Library/Caches/sherpa-rs
            ~/Library/Caches/ort.pyke.io

      - name: Set LIBCLANG_PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "LIBCLANG_PATH=$(brew --prefix llvm@18 2>/dev/null || brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvm)) {
            $llvm = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      # Resolve the feature graph for the toolkit-absent backends. `cargo tree
      # -e features` expands every inter-crate forward edge and fails if one is
      # broken, without compiling any GPU kernel. Runs on bash (Git Bash on
      # Windows-hosted runners).
      - name: Validate GPU feature graph (toolkit-absent backends)
        if: matrix.graph_features != ''
        shell: bash
        run: |
          set -euo pipefail
          for feat in ${{ matrix.graph_features }}; do
            echo "::group::cargo tree -e features --features $feat"
            cargo tree -p minutist --no-default-features \
              --features "$feat" -e features --locked
            echo "::endgroup::"
          done

      # Full cargo check for the backend whose toolchain is present on this
      # runner (vulkan SDK on Linux, Metal on macOS). Skipped when
      # check_features is empty (Windows — Vulkan SDK absent; see matrix note).
      # This validates the feature graph AND the build-script/link path.
      - name: cargo check (${{ matrix.check_features }})
        if: matrix.check_features != ''
        shell: bash
        run: |
          cargo check -p minutist --no-default-features \
            --features ${{ matrix.check_features }} --locked

      # Build-variant feature-graph guards.
      #
      # Free build: mcp-server and rmcp must be ABSENT from the feature graph.
      # Connected build (default): mcp-server must be PRESENT.
      # Also validate that the free build compiles cleanly (CPU-only, no GPU
      # toolkit needed).
      - name: Validate free-build feature graph (mcp-server/rmcp absent)
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::cargo tree --no-default-features (free build)"
          cargo tree -p minutist --no-default-features -e features --locked
          echo "::endgroup::"
          # Fail if mcp-server or rmcp appears in the free feature tree.
          if cargo tree -p minutist --no-default-features -e features --locked \
               | grep -qE 'mcp-server|rmcp'; then
            echo "ERROR: mcp-server or rmcp found in --no-default-features tree"
            exit 1
          fi
          echo "PASS: mcp-server and rmcp absent from free build"

      - name: Validate connected-build feature graph (mcp-server present)
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::cargo tree (connected default)"
          cargo tree -p minutist -e features --locked
          echo "::endgroup::"
          if ! cargo tree -p minutist -e features --locked \
                 | grep -q 'mcp-server'; then
            echo "ERROR: mcp-server missing from default (connected) feature tree"
            exit 1
          fi
          echo "PASS: mcp-server present in connected build"

      - name: cargo check free build (CPU-only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo check -p minutist --no-default-features --locked
