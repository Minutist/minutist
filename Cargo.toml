[workspace]
resolver = "2"
members = [
    "crates/common",
    "spikes/asr",
    "spikes/llm",
    "spikes/vad-loop",
    "spikes/diarize",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "proprietary"
authors = ["Andrew Leech <andrew@alelec.net>"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
