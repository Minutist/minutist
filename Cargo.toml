[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/audio-capture",
    "crates/vad-chunker",
    "crates/settings",
    "crates/persistence",
    "crates/model-registry",
    "crates/asr-runtime",
    "crates/asr-parakeet",
    "crates/summariser",
    "crates/diarizer",
    "crates/orchestrator",
    "crates/agent-tools",
    "crates/chat-agent",
    "crates/mcp-server",
    "crates/ipc-bridge",
    "src-tauri",
    "spikes/asr",
    "spikes/llm",
    "spikes/vad-loop",
    "spikes/diarize",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "AGPL-3.0-only"
authors = ["Andrew Leech <andrew@alelec.net>"]

[workspace.dependencies]
# Existing
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

# Phase 1 additions
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cpal = "0.16"
rubato = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util"] }
tracing-appender = "0.2"

# Opus encoder (Phase 1 persistence). audiopus = bindings to libopus.
# audiopus 0.3.x is pre-release ("0.3.0-rc.0"); Cargo's semver doesn't
# resolve pre-releases from a "0.3" constraint, so the explicit
# rc tag is required at the workspace level.
audiopus = "0.3.0-rc.0"
ogg = "0.9"

# Tauri 2.x — pinned to Handy's verified versions.
tauri = { version = "2.10", features = [] }
tauri-build = "2.4"
tauri-plugin-fs = "2.4"
# Open the user's default browser at the pre-filled GitHub issue URL for the
# "Report a problem" flow (issue #0014). No silent network — it hands the URL
# to the OS browser at the user's click.
tauri-plugin-opener = "2.5"
tauri-plugin-store = "2.4"
# Auto-update (Phase 7). Driven from Rust via UpdaterExt (no JS plugin needed);
# see architecture/cross-cutting.md "Auto-update".
tauri-plugin-updater = "2.10"

# tauri-specta — pinned to Handy's working set; bumping these is a coordinated
# architecture-owner change because they gate the IPC contract for every phase.
# `derive` enables `#[derive(specta::Type)]` when the `specta` feature is
# activated on `common` / `settings`.
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

# Phase 2 additions

# llama.cpp text + audio (mtmd) — Phase 0 Spike 1 verified pin. Used by
# `asr-runtime` (Phase 2) and `summariser` (Phase 5).
llama-cpp-2 = { version = "=0.1.146", default-features = false, features = ["mtmd"] }

# Silero VAD wrapper — same SHA Handy ships in its Cargo.lock; the Spike 3
# binding-fidelity finding holds at this commit. Default features
# (`helpers` = `ebur128` + `samplerate`) disabled — we resample in
# `audio-capture` (rubato) and EBU loudness is not needed.
vad-rs = { git = "https://github.com/cjpais/vad-rs", rev = "2a412ed858695b9251f3f5a1a20d95b59fa7c498", default-features = false }

# ort is a transitive dependency via vad-rs, which pins ort =2.0.0-rc.12 but
# disables default features (including `download-binaries`). Without
# `download-binaries`, ort-sys emits a `link_error` cfg and never downloads the
# ONNX Runtime static library, causing a linker failure on CI runners that have
# no pre-installed libonnxruntime. Declaring ort here with `download-binaries`
# unifies the feature set (Cargo merges feature lists for the same crate/version
# across the workspace), ensuring the prebuilt binary is fetched on first build.
ort = { version = "=2.0.0-rc.12", features = ["download-binaries"] }

# Download + hash for `model-registry`. rustls-tls avoids pulling OpenSSL
# on Linux / Windows builds; `stream` is required for chunked download
# into the SHA-256 hasher.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
futures-util = "0.3"

# `vad-chunker` uses crossbeam-channel for the bounded VAD worker channel
# (matches the Phase 0 Spike 3 pattern).
crossbeam-channel = "0.5"

# Phase 4 additions
# libsql (Turso) as the local meeting index, used by `persistence`.
# default-features=false + "core" gives the embedded local database WITHOUT the
# replication / remote / HTTP stack we do not use in v1. Gate-A spike confirmed
# it builds AND runs on Linux and Windows MSVC (libsql-ffi compiles the C
# amalgamation via cc + bindgen; LIBCLANG_PATH is already required for the
# llama-cpp bindgen build). Honours the locked choice of libsql; the index
# is a derived cache, rebuildable from the per-meeting folders on disk (see
# cross-cutting.md — Filesystem layout).
libsql = { version = "0.9.30", default-features = false, features = ["core"] }

# Phase 6 additions
# sherpa-rs (Thewh1teagle binding to sherpa-onnx) for opt-in offline speaker
# diarization, used by `diarizer`. =0.6.8 → sherpa-rs-sys 0.6.7 pins sherpa-onnx
# v1.12.9 (Spike 4). `download-binaries` fetches the matching prebuilt
# sherpa-onnx libs; default features (tts etc.) disabled. The static-bundle
# feature is a Phase-7 concern. Pinned EXACT; bumping is a coordinated change.
sherpa-rs = { version = "=0.6.8", default-features = false, features = ["download-binaries"] }

# Output-language locale resolution (ipc-bridge). sys-locale 0.3 returns the
# host BCP-47 locale tag on Linux (envvar + XDG), macOS (CFLocale), and Windows
# (GetUserDefaultLocaleName). No OS-framework dep beyond what Tauri already
# pulls; the crate is pure-Rust on Linux/macOS and links the small Windows API
# through winapi. Used only by `ipc-bridge`'s `output_language` module.
sys-locale = "0.3"

# Phase 10 additions
# rmcp — the official Rust MCP SDK (modelcontextprotocol/rust-sdk). Used by the
# `mcp-server` crate to expose the agent-tools registry over Streamable HTTP.
# Pin a 1.x line (NOT the stale 0.x examples). Hard floor 1.4.0 for the
# `Host`-header DNS-rebinding fix (GHSA-89vp-x53w-74fx); we use 1.7. The
# `transport-streamable-http-server` feature pulls rmcp's own hyper-based server
# transport (server-side-http + tower + the LocalSessionManager) — NO axum
# needed: Gate-A SP1 confirmed standalone serving, and `cargo tree -d` shows no
# http/hyper/tower/tokio skew against Tauri 2.11's stack (rmcp wants http 1.x,
# hyper 1.x, tower 0.5 — the same majors the existing tree already resolves).
# `macros` is unused by the hand-written dynamic ServerHandler but harmless;
# `schemars` lets rmcp's tool-schema layer coexist (we pass the agent-tools
# JSON Schema through verbatim as a serde_json::Value).
rmcp = { version = "1.7", default-features = false, features = [
    "server", "macros", "transport-streamable-http-server", "schemars",
] }
# High-entropy bearer-token generation (app-main). CSPRNG-backed random bytes
# via `OsRng`; 256-bit token hex-encoded.
rand = "0.8"
hex = "0.4"
# `mcp-server` validates the Authorization / Origin / Host headers off the raw
# `http::HeaderMap` rmcp surfaces; `http` is the shared header/types crate the
# whole hyper stack already uses (no new major).
http = "1"
