    <use id="nib" href="#spade" mask="url(#nibcut)"/>
    <path id="baseline" d="M 290 814 C 268 828 251 843 243 856 C 240 860 244 861 252 860 L 862 859 C 879 858 889 850 889 836 C 889 823 879 814 862 814 L 290 814 Z"/>
  </g>
</svg>
