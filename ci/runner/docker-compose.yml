# Self-hosted Linux runner for Minutist CI. See README.md for setup.
#
# The state dir is mounted at the SAME path inside the container as on the
# host: container actions are spawned as sibling containers via the docker
# socket, and the bind paths the runner hands them must resolve on the host
# daemon. Do not change one side of the mapping without the other.
services:
  github-runner:
    # Context is the repo root so the Dockerfile can COPY ci/scripts/ (the
    # single-source dep script) and ci/runner/entrypoint.sh. .dockerignore at
    # the repo root keeps the build context small.
    build:
      context: ../..
      dockerfile: ci/runner/Dockerfile
      args:
        UID: "1000"
        GID: "1001"
    image: minutist-ci-runner:local
    container_name: minutist-github-runner
    restart: unless-stopped
    env_file: .env
    environment:
      RUNNER_STATE_DIR: ${RUNNER_STATE_BASE:-/mnt/bulk/srv/github-runner}/state
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    volumes:
      - ${RUNNER_STATE_BASE:-/mnt/bulk/srv/github-runner}/state:${RUNNER_STATE_BASE:-/mnt/bulk/srv/github-runner}/state
      - ${RUNNER_STATE_BASE:-/mnt/bulk/srv/github-runner}/toolcache:/opt/hostedtoolcache
      - /var/run/docker.sock:/var/run/docker.sock

  # Second replica: two sessions push concurrently and a single runner
  # serializes ~6 Linux jobs per push, so queued validations get clawed back
  # by the next push's cancel-in-progress group before they run. Same image;
  # own state dir (same-path mount rule applies) and own registration.
  github-runner-2:
    build:
      context: ../..
      dockerfile: ci/runner/Dockerfile
      args:
        UID: "1000"
        GID: "1001"
    image: minutist-ci-runner:local
    container_name: minutist-github-runner-2
    restart: unless-stopped
    env_file: .env2
    environment:
      RUNNER_STATE_DIR: ${RUNNER_STATE_BASE:-/mnt/bulk/srv/github-runner}/state2
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    volumes:
      - ${RUNNER_STATE_BASE:-/mnt/bulk/srv/github-runner}/state2:${RUNNER_STATE_BASE:-/mnt/bulk/srv/github-runner}/state2
      - ${RUNNER_STATE_BASE:-/mnt/bulk/srv/github-runner}/toolcache:/opt/hostedtoolcache
      - /var/run/docker.sock:/var/run/docker.sock
