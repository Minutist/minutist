[package]
name = "asr-parakeet"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# GPU acceleration backends, OFF by default — forward to sherpa-rs. sherpa-onnx
# exposes CUDA and (Windows) DirectML; no Vulkan/Metal ONNX backend, so this
# follows the diarizer in staying CPU (ONNX Runtime CPU EP) on those platforms.
cuda = ["sherpa-rs/cuda"]
directml = ["sherpa-rs/directml"]

[dependencies]
meeting-app-common = { path = "../common" }
thiserror = { workspace = true }
tracing = { workspace = true }
# sherpa-onnx offline transducer recogniser (Parakeet TDT v3). Workspace-pinned
# =0.6.8 with `download-binaries`. The `sys` feature re-exports sherpa_rs_sys so
# we can read the per-token timestamps the high-level `transcribe()` drops.
sherpa-rs = { workspace = true, features = ["sys"] }
