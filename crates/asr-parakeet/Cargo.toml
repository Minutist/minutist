[package]
name = "asr-parakeet"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# GPU acceleration backend, OFF by default — forwards to sherpa-rs. No
# `directml` feature: `ParakeetBackend::new` hardcodes the ONNX Runtime
# provider string to `"cpu"` unconditionally (src/lib.rs), so a DirectML
# feature would link without the backend ever requesting that provider; not
# exposed until the provider selection is actually wired to the build feature.
cuda = ["sherpa-rs/cuda"]

[dependencies]
minutist-common = { path = "../common" }
thiserror = { workspace = true }
tracing = { workspace = true }
# sherpa-onnx offline transducer recogniser (Parakeet TDT v3). Workspace-pinned
# =0.6.8 with `download-binaries`. The `sys` feature re-exports sherpa_rs_sys so
# we can read the per-token timestamps the high-level `transcribe()` drops.
sherpa-rs = { workspace = true, features = ["sys"] }

[dev-dependencies]
tempfile = "3"
