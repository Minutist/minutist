[package]
name = "asr-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# GPU acceleration backends (Phase 7). All OFF by default → the default build
# is CPU-only and needs no GPU SDK. Each forwards to the matching llama-cpp-2
# backend feature; CI selects one per platform (vulkan on Windows/Linux, metal
# on macOS) and llama.cpp falls back to CPU at runtime when no device exists.
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
rocm = ["llama-cpp-2/rocm"]

[dependencies]
meeting-app-common = { path = "../common" }
model-registry = { path = "../model-registry" }
settings = { path = "../settings" }
llama-cpp-2 = { workspace = true }
encoding_rs = "0.8"
num_cpus = "1.16"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
hound = { workspace = true }
tracing-subscriber = { workspace = true }
