[package]
name = "diarizer"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# GPU acceleration backends (Phase 7), OFF by default — forward to sherpa-rs.
# sherpa-onnx exposes CUDA and (Windows) DirectML; there is no Vulkan/Metal
# diarization backend, so the diarizer follows the llama.cpp backend on those
# platforms by staying CPU (ONNX Runtime CPU EP).
cuda = ["sherpa-rs/cuda"]
directml = ["sherpa-rs/directml"]

[dependencies]
minutist-common = { path = "../common" }
thiserror = { workspace = true }
tracing = { workspace = true }
# sherpa-onnx offline speaker diarization (segmentation + embedding + clustering).
# Workspace-pinned =0.6.8 with `download-binaries`; see workspace Cargo.toml.
sherpa-rs = { workspace = true }

[dev-dependencies]
# WAV decoding for the env-var-gated fixtures (`tests/accuracy.rs`,
# `tests/online_embedding.rs`).
hound = { workspace = true }
# `persistence::read_audio_pcm` + `read_transcript` for the env-var-gated
# over-split count-vs-knob eval (`tests/oversplit_eval.rs`, issue #63). Test-only
# (dev-dependency), so no `diarizer → persistence` runtime edge — persistence
# depends only on `common`, so there is no cycle.
persistence = { path = "../persistence" }
tempfile = "3"
