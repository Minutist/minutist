[package]
name = "doc-convert"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Owner role: data-engineer.
# Converts raw document bytes to markdown for the summariser reference-material
# feed. Depends ONLY on `common` (AppError/AppResult at the boundary) and
# third-party parser crates — no other workspace-component edges.

[dependencies]
minutist-common = { path = "../common" }
thiserror = { workspace = true }
tracing = { workspace = true }

# Document parsers (pinned to current crates.io at Gate-A, 2026-06-22)
calamine      = { workspace = true }          # XLSX / ODS spreadsheet reader
csv           = { workspace = true }          # CSV → markdown table
dom_smoothie  = { workspace = true }          # HTML readability extraction
htmd          = { workspace = true }          # HTML → Markdown
mail-parser   = { workspace = true }          # .eml parsing
pdf_oxide     = { workspace = true }          # Digital-text PDF extraction (pure-Rust)
quick-xml     = { workspace = true }          # PPTX OOXML walk (ppt/slides/*.xml)
zip           = { workspace = true }          # PPTX / XLSX / ODS zip container + bomb guard

# Image-attachment VLM OCR (third-party only — keeps doc-convert a common-only
# leaf; no workspace-component edge). `image` decodes a png/jpg/jpeg/tiff
# attachment and re-encodes it to PNG, the format the injected `DocVlm` expects.
image = { workspace = true }

# Markdown normalisation
pulldown-cmark          = { workspace = true }
pulldown-cmark-to-cmark = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Used only by the PDF integration tests to synthesise small text/blank PDFs at
# test time rather than committing opaque binary fixtures.
printpdf = "0.7"
# DEV-ONLY writer used to synthesise a small DOCX fixture (heading, paragraph,
# list, table) at test time. Never a production dependency — the `docx`
# converter reads OOXML with `zip` + `quick-xml`, the same as `pptx`.
docx-rs = "0.4"
