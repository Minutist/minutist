[package]
name = "headless"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

# WS4-B: the user-installed headless server daemon (`minutist-hub`). The user
# runs it as an always-on service on their OWN hardware; it pairs into the device
# mesh exactly like a desktop and holds meeting plaintext — but on hardware the
# user owns, so it stays within the same trust boundary as the desktop (it is NOT
# the hosted relay, which only ever brokers ciphertext). Two capabilities behind
# one binary, by configuration: an always-on sync hub now, a GPU processing node
# post-launch.
#
# It is a SECOND workspace binary beside `src-tauri` (app-main): a standalone
# `cargo build` target with no Tauri / webview pipeline, so it cross-compiles to
# a server target and packages as a systemd unit or a minimal OCI image. It is
# always-compiled under `cargo build --workspace` (like `sync`) but the desktop
# free/connected artefacts never link it. It takes no `tauri::*` / `ipc-bridge`
# edge; it wires `sync::SyncEngine` into a daemon directly.

[[bin]]
name = "minutist-hub"
path = "src/main.rs"

[dependencies]
minutist-common = { path = "../common" }
sync = { path = "../sync" }
# Account-mediated peer discovery (5.5b): headless uses AccountDirectoryClient to
# publish its own endpoint and fetch the account's device list, adapting onto
# sync::AccountEndpointSource — so a seeded hub is a GUI-free "device B" without
# a manual ticket exchange. headless -> tunnel-client is unconditional; the edge
# is documented in architecture/components.md (⊕ footnote).
tunnel-client = { path = "../tunnel-client" }
# Required by the AccountDirectorySource adapter that implements
# sync::AccountEndpointSource.
async-trait = { workspace = true }
# Used directly by the `status` subcommand to project a meeting's notes.ydoc to a
# content digest (NotesStore::read_ydoc_state + ydoc::{apply_update_v1,ydoc_to_json})
# and to scan meeting-folder ids (folder::list_meeting_ids) — read from the leaf
# directly rather than through `persistence`'s re-export.
notes-crdt = { path = "../notes-crdt" }
# Used directly by the `status` subcommand for `read_metadata`, and by the daemon
# for `meeting_ops::apply_processing_lifecycle`. Within the permitted phase-1 edge
# set (common/persistence/sync/settings).
persistence = { path = "../persistence" }
clap = { workspace = true, features = ["env"] }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
# `json` adds the opt-in structured tracing formatter (MINUTIST_HUB_LOG_JSON=1).
tracing-subscriber = { workspace = true, features = ["json"] }
tracing-appender = { workspace = true }
# Validate a peer pairing ticket in `add-peer`, and resolve a ticket to its
# `EndpointId` for `status`. Same EXACT pin as `sync`, which owns the round-trip.
iroh-tickets = "=1.0.0"
iroh = "=1.0.0"
# `status`: parse `{uuid}` meeting-folder names + digest the projected notes.
uuid = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Compiles `bind_sync_engine`'s `MINUTIST_HUB_INSECURE_RELAY_TLS` escape hatch
# (main.rs), which trusts hub_e2e's in-process test relay's self-signed
# certificate instead of verifying it. NOT enabled in the production build —
# forced on below ONLY for `cargo test -p headless`, via the self-dependency
# trick `sync` itself uses (a package's own targets share one feature set
# within a single `cargo test` invocation, so listing `headless` as its own
# dev-dependency with the feature on forces it onto the `minutist-hub` bin
# target that `hub_e2e` spawns, with no `--features` flag needed). Cargo prints
# a harmless "ignoring invalid dependency `headless`" warning for this
# self-reference (this package has no `[lib]`, so the dependency edge itself is
# unusable) but still unifies the feature onto the bin target — verified
# empirically: a `#[cfg(feature = "test-support")]` compile-time probe fires
# under `cargo test -p headless` and not under `cargo build -p headless`.
test-support = ["sync/test-support"]

[dev-dependencies]
headless = { path = ".", features = ["test-support"] }
tempfile = "3"
# The hub_e2e integration test spawns the built binary and drives two
# SyncEngines through it. Integration tests don't inherit [dependencies], so the
# crates they touch are restated here. `test-support` exposes
# `SyncEngine::start_insecure`, used directly by the test's own in-process
# engines (the spawned `minutist-hub` binary gets it via `[features]` above).
sync = { path = "../sync", features = ["test-support"] }
persistence = { path = "../persistence" }
notes-crdt = { path = "../notes-crdt" }
minutist-common = { path = "../common" }
# `test-utils` exposes `iroh::test_utils::run_relay_server`, the in-process relay
# `hub_e2e` spins for its local-by-default runs (AllowAll access, no token). Same
# exact pin as `[dependencies]`.
iroh = { version = "=1.0.0", features = ["test-utils"] }
uuid = { workspace = true }
serde_json = { workspace = true }
# The ungated create-meeting test digests the notes ydoc to compare A/B status.
sha2 = { workspace = true }
tokio = { workspace = true, features = ["process"] }
