[package]
name = "ipc-bridge"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

# The ONLY non-app-main crate allowed to import `tauri::*`.
# See architecture/domain-ownership.md — `ipc-bridge` / `systems-engineer` role.

[dependencies]
meeting-app-common = { path = "../common", features = ["specta"] }
orchestrator = { path = "../orchestrator" }
persistence = { path = "../persistence" }
summariser = { path = "../summariser" }
settings = { path = "../settings", features = ["specta"] }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
tauri = { workspace = true }
tauri-specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }  # for MeetingIdType's From impl

[dev-dependencies]
specta-typescript = { workspace = true }
tempfile = "3"
tracing-subscriber = { workspace = true }
# Test-only: the manifest-consistency guard (`tests/default_model_manifest.rs`)
# parses `resources/models.json` to assert the bundled DEFAULT_LLM_MODEL_ID
# stays a real `kind = Llm` entry. This is a dev-dependency, not a production
# edge — `ipc-bridge` still resolves models only through `Orchestrator`
# (no production `model-registry` dependency; see components.md dependency
# table). Mirrors `orchestrator`'s test-only `model-registry` dev-dependency.
model-registry = { path = "../model-registry" }
