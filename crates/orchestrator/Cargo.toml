[package]
name = "orchestrator"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

# Phase 1 Stream D: minimal state machine (start/stop/pause, audio meter forwarding).
# The live pipeline (VAD → ASR → events) lands in Phase 2 — do NOT preempt that.

[features]
# Enables the test-support module and the start_with_streams constructor.
# Used by integration tests that need deterministic audio without a real device.
test-source = ["audio-capture/test-source"]
# GPU acceleration backends (Phase 7), OFF by default — fan out to the ML crates
# orchestrator owns (asr-runtime + diarizer; summariser is reached via ipc-bridge,
# not here — rule A5). vulkan/metal/rocm drive the llama.cpp-backed asr-runtime;
# cuda also reaches the sherpa-backed diarizer; directml is diarizer-only.
vulkan = ["asr-runtime/vulkan"]
metal = ["asr-runtime/metal"]
rocm = ["asr-runtime/rocm"]
cuda = ["asr-runtime/cuda", "diarizer/cuda"]
directml = ["diarizer/directml"]

[dependencies]
meeting-app-common = { path = "../common" }
audio-capture = { path = "../audio-capture" }
vad-chunker = { path = "../vad-chunker" }
asr-runtime = { path = "../asr-runtime" }
diarizer = { path = "../diarizer" }
model-registry = { path = "../model-registry" }
persistence = { path = "../persistence" }
settings = { path = "../settings" }
chrono = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
tracing-subscriber = { workspace = true }
audio-capture = { path = "../audio-capture", features = ["test-source"] }
model-registry = { path = "../model-registry" }
persistence = { path = "../persistence" }
settings = { path = "../settings" }
sha2 = { workspace = true }
audiopus = { workspace = true }
ogg = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
hound = { workspace = true }

[[test]]
name = "start_record_stop"
required-features = ["test-source"]

[[test]]
name = "back_pressure"
required-features = ["test-source"]

[[test]]
name = "transcription_e2e"
required-features = ["test-source"]

[[test]]
name = "pipeline_stub_test"
required-features = ["test-source"]

[[test]]
name = "asr_error_resilience"
required-features = ["test-source"]

[[test]]
name = "re_transcribe"
required-features = ["test-source"]

[[test]]
name = "rediarize"
required-features = ["test-source"]

[[test]]
name = "timeline_coherence"
required-features = ["test-source"]

[[test]]
name = "live_diarization"
required-features = ["test-source"]
