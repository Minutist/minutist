[package]
name = "persistence"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Phase 4 full surface: readers (incl. graduated Opus decoder), the libsql
# `index.db` index + forward-only migration runner + rebuild-from-disk,
# rename/delete meeting ops, summary.md I/O, and the MeetingState assembler.

[dependencies]
minutist-common = { path = "../common" }
# notes-crdt: the extracted notes-CRDT primitives (yrs `ydoc`, `NotesStore`,
# `MeetingFolder`, the `metadata.json` writer). `persistence` re-exports these at
# their historical paths so its callers are unchanged. The split keeps the
# C-heavy graph (libsql / audiopus / ogg) out of `sync`'s compile path. A
# leaf workspace crate (depends only on `common`); see the dependency table in
# `architecture/components.md`.
notes-crdt = { path = "../notes-crdt" }
audiopus = { workspace = true }
chrono = { workspace = true }
libsql = { workspace = true }
ogg = { workspace = true }
symphonia = { workspace = true }
# Batch (not streaming) resample of a decoded AAC track's native rate to the
# workspace's fixed 16 kHz mono PCM shape (0047). Already a workspace dep
# (audio-capture uses it for the live-capture path); this is an independent
# one-shot use, not a shared instance — the two crates decode from different
# starting points (a live device stream vs. a whole file already in memory).
rubato = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Content-addressed note image asset filenames (SHA-256 of the bytes), so
# identical pastes dedupe. Already in the workspace dep set (model-registry).
sha2 = { workspace = true }
thiserror = { workspace = true }
# tokio: `spawn_blocking` drives the synchronous folder readers from the async
# `rebuild_from_disk` path (see the threading model in
# `architecture/cross-cutting.md`). The crate exposes async fns over libsql but
# never calls `block_on`.
tokio = { workspace = true }
tracing = { workspace = true }
# uuid: voiceprints.rs mints identity/centroid/contribution primary keys and
# parses them back from the TEXT columns (issue #0003 VoiceprintStore).
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
