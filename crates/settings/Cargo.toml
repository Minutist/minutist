[package]
name = "settings"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
minutist-common = { path = "../common" }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# When enabled, `Settings` and `Theme` derive `specta::Type` so the
# generated TypeScript bindings can import them directly. Enabled by
# `ipc-bridge` (which itself enables it on `minutist-common`).
specta = ["dep:specta", "minutist-common/specta"]

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
