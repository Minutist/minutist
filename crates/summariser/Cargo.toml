[package]
name = "summariser"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
meeting-app-common = { path = "../common", features = ["llama-backend"] }
llama-cpp-2 = { workspace = true }
encoding_rs = "0.8"
num_cpus = "1.16"
thiserror = { workspace = true }
tracing = { workspace = true }

# Optional external-LLM dispatcher dependencies (FR-29), pulled in only by the
# `external-ollama` feature.
reqwest = { workspace = true, features = ["blocking", "json"], optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
# Test-only: the `external-ollama` ollama.rs unit tests assert the ChatRequest
# serde shape / deserialise a canned ChatResponse. `serde_json` is not a
# production dependency (the feature uses `reqwest`'s `.json()` helper, which
# pulls its own serde_json transitively); declaring it here keeps it test-only.
serde_json = { workspace = true }

[features]
# Optional external-LLM (Ollama) dispatcher (FR-29); off by default. Routes
# summarisation to a local Ollama / LM-Studio-compatible chat endpoint instead
# of loading a GGUF in-process.
external-ollama = ["dep:reqwest", "dep:serde"]
# GPU acceleration backends (Phase 7), OFF by default — forward to llama-cpp-2.
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
rocm = ["llama-cpp-2/rocm"]
