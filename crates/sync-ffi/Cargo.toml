[package]
name = "sync-ffi"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# Android FFI wrapper over the `sync` crate's `SyncEngine` (WS4-B, phone
# companion / issue 0016). UniFFI exposes the transport subset to Kotlin; the
# `.so` is cross-compiled to aarch64-linux-android in the minutist-mobile repo's
# `docker/android-build` image (NDK r27 + cargo-ndk + the pinned 1.91 toolchain)
# and bundled by gradle. It depends ONLY on `sync` (the engine it wraps) and
# `common` (the wire types it maps at the boundary) — it takes NO `iroh`
# dependency of its own: peers are addressed by passing hex id strings to
# `SyncEngine`'s string-keyed `*_to_peer` methods, which relay-address them
# internally. NOT linked by any desktop binary; `app-main` / `ipc-bridge` have
# no edge on it.
#
# Option A (issue 0016): wrap OUR `SyncEngine`, not upstream `iroh-ffi`. That
# subsumes the media-blob path — `sync_media` / `import_media` already
# encapsulate `iroh-blobs`, so it never reaches the boundary; no separate
# iroh-blobs FFI is needed.

[lib]
# cdylib: the aarch64 `.so` gradle bundles. lib: lets the workspace build/test
# the crate on the host (the wrap compiles natively even though the binding
# artifacts are generated out-of-tree for Android).
crate-type = ["cdylib", "lib"]

[[bin]]
# Library-mode UniFFI binding generator: `uniffi-bindgen generate --library
# <the .so> --language kotlin`. Run in the mobile build to emit Kotlin bindings.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# The crate this wraps. Its public `SyncEngine` is the entire FFI surface.
sync = { path = "../sync" }
# The wire types `SyncEngine` surfaces (`MeetingId`, `ProcessingLifecycle`,
# `MeetingMeta`, `Segment`, `AudioFormat`), mapped to FFI-facing records at the
# boundary.
minutist-common = { path = "../common" }
# The C-free leaf the phone data layer rides: `MeetingFolder::ensure`,
# `NotesStore`, and the lifted `read_metadata` / `write_metadata` /
# `update_metadata_if_present` + `merge_processing` — so save / list / get +
# lifecycle-apply stay off `persistence`'s C-heavy graph (issue 0016).
notes-crdt = { path = "../notes-crdt" }
# UniFFI binding generation. `cli` provides `uniffi_bindgen_main` for the
# library-mode bindgen binary above.
uniffi = { version = "0.31", features = ["cli"] }
# The wrapper owns a multi-thread runtime: `SyncEngine` holds none (its accept
# loop was spawned under an ambient runtime), and the phone has no Tauri/ambient
# tokio. Sync FFI methods `block_on` it; event subscriptions drain on dedicated
# OS threads (off the runtime — see the C1 note in lib.rs).
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Parse meeting-id strings off the boundary back into `MeetingId(Uuid)`.
uuid = { workspace = true }
# Epoch-ms <-> RFC3339 for the meeting timestamps: the phone model carries them
# as numbers, `metadata.json` stores ISO strings. Same workspace pin as
# notes-crdt — no new transitive crate.
chrono = { workspace = true }
# Build the captured note's ProseMirror doc + parse `transcript.json` off disk.
serde_json = { workspace = true }

# Android-only: route this crate's (and iroh's) `tracing` output to logcat. The
# `.so` otherwise installs no subscriber, so ALL relay-actor / handshake /
# net_report tracing is dropped on the phone (issue 0040 field-test — the phone
# is the only genuinely-external relay client, and its homing failure is only
# visible in its iroh logs). Target-gated so the host/desktop workspace build
# never pulls these; the desktop/headless consumers install their own subscriber.
[target.'cfg(target_os = "android")'.dependencies]
tracing-subscriber = { workspace = true, features = ["fmt"] }
# tracing-subscriber MakeWriter that writes to Android logcat (liblog via the
# NDK, linked by the mobile cross-compile). Android-only.
paranoid-android = "0.2"

[dev-dependencies]
# Tempdir meetings-root for the data-layer projection / save tests.
tempfile = "3"
