[package]
name = "sync"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

# WS4-B: device-to-device sync over iroh + iroh-blobs. The crate exchanges Yjs
# notes-updates (a small custom QUIC protocol) and meeting-media blobs (audio +
# note assets) directly between a user's own paired devices, dialled through the
# self-hosted relay (sync.minutist.ai) with out-of-band addressing. It depends on
# `common` (shared types / errors) and `persistence` (read the authoritative
# `notes.ydoc` + meeting-media paths; apply received updates). Part of the
# CONNECTED feature surface: the crate lives in the workspace unconditionally
# (like `mcp-server` / `tunnel-client`) but the app-main -> sync edge + the
# ipc-bridge trait injection are only wired behind the `connected` feature in a
# later slice (S5).

[dependencies]
minutist-common = { path = "../common" }
persistence = { path = "../persistence" }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Device-to-device transport. iroh 1.0 supplies the QUIC endpoint, the ed25519
# device identity, the custom relay (RelayMode::Custom -> sync.minutist.ai), and
# out-of-band addressing (MemoryLookup) for peers learned over the account
# service. Pinned EXACT; the 1.0 API is a hard floor and bumping is a coordinated
# change.
iroh = "=1.0.0"
# Content-addressed blob transfer (audio + note assets). iroh-blobs 0.103 tracks
# iroh 1.0 but is still pre-1.0, so it is pinned EXACT and re-checked on bumps.
iroh-blobs = "=0.103.0"
