[package]
name = "sync"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

# WS4-B: device-to-device sync over iroh. The crate exchanges Yjs notes-updates
# (a small custom QUIC protocol) and content-addressed meeting media (audio +
# note assets, over `iroh-blobs`) directly between a user's own paired devices,
# dialled through the self-hosted relay (sync.minutist.ai) with out-of-band
# addressing. It depends on `common` (shared types / errors) and `notes-crdt`
# (read the authoritative `notes.ydoc` via `NotesStore`; apply received updates;
# `MeetingFolder::ensure` the inbound folder). It does NOT depend on
# `persistence`: the notes-CRDT primitives were extracted into the leaf
# `notes-crdt` crate so `sync`'s lib stays off the C-heavy graph (libsql /
# audiopus / ogg) and cross-compiles to aarch64-linux-android. The integration
# tests pull `persistence` as a DEV-dependency for `persistence::assets`
# (note-image round-trips), which stays in `persistence`. Part of the CONNECTED
# feature surface: the crate lives in the workspace unconditionally (like
# `mcp-server` / `tunnel-client`) but the app-main -> sync edge is wired behind
# the `connected` feature.

[dependencies]
minutist-common = { path = "../common" }
# async-trait: the injected `account::AccountEndpointSource` seam (the account-
# service HTTP fetcher), mirroring `election::ElectionDriver`'s trait-object
# collaborator boundary. No HTTP/account-service dependency of its own — the
# consumer (app-main / sync-ffi) supplies the implementation.
async-trait = { workspace = true }
# notes-crdt: the notes-CRDT primitives this crate transports — `NotesStore`
# (read the authoritative `notes.ydoc`; merge received updates) and
# `MeetingFolder::ensure` (the inbound-meeting folder seam). Depending on the
# leaf instead of `persistence` keeps the C-heavy graph out of `sync`'s compile
# path. The `yrs` pin matches transitively, so the on-the-wire encoding agrees.
notes-crdt = { path = "../notes-crdt" }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Device-to-device transport. iroh 1.0 supplies the QUIC endpoint, the ed25519
# device identity, the custom relay (RelayMode::Custom -> sync.minutist.ai), and
# out-of-band addressing (MemoryLookup) for peers learned over the account
# service. Pinned EXACT; the 1.0 API is a hard floor and bumping is a coordinated
# change.
iroh = "=1.0.0"
# Shareable endpoint tickets (manual device pairing). `iroh-tickets` carries the
# `EndpointTicket` Display/FromStr round-trip that serialises this device's
# `EndpointAddr` to a string the user copies to another device. Pinned EXACT to
# track the iroh 1.0 line alongside `iroh`.
iroh-tickets = "=1.0.0"
# Content-addressed media-blob sync. `iroh-blobs` supplies the BLAKE3 blob store
# (the `fs-store` feature pulls redb for a persistent on-disk store), the
# `BlobsProtocol` handler multiplexed onto the same `Router` under a second ALPN,
# and the downloader that reuses our existing `Endpoint` (sharing the relay
# path). It depends on `iroh ^1.0.0`; the `=1.0.0` pin is in range and keeps ONE
# `iroh` in the tree so `Endpoint`/`Connection`/`EndpointId` unify across the
# `.accept()`/`connect()`/`downloader()` boundary. Pinned EXACT alongside `iroh`.
iroh-blobs = { version = "=0.103.0", features = ["fs-store"] }
# Optional, enabled only under `test-support`, so `SyncEngine::start_insecure` can
# name `iroh_relay::tls::CaTlsConfig` to trust the in-process test relay's
# self-signed certificate (`iroh::test_utils::run_relay_server`) instead of
# verifying against the system CA roots. `iroh-relay` is ALREADY a transitive
# dependency of `iroh` at the same version and is linked into the production binary
# regardless — so this adds no new crate; it only lets this crate NAME the type for
# the test-only constructor. The production safety guarantee is therefore the
# cfg-gate on the sole `insecure_skip_verify` call site (`start_insecure` is
# `#[cfg(feature = "test-support")]`), NOT the crate's absence.
iroh-relay = { version = "=1.0.0", optional = true }
# yrs — the Yjs CRDT port. `notes-crdt` owns the authoritative `notes.ydoc` and
# its projections; `sync` uses yrs only for the wire-level reconciliation math on
# lib0-v1 update bytes (`encode_state_vector_from_update_v1` / `diff_updates_v1`),
# never to materialise a doc or re-derive projections. Same workspace pin as
# `notes-crdt` so the two agree on the on-the-wire encoding.
yrs = { workspace = true }
# UUID — decode the fixed 16-byte meeting id off the wire back into a `MeetingId`.
uuid = { workspace = true }
# chrono — parse the RFC 3339 `produced_at` authority on artifact-manifest entries
# to an instant for the strict-`>` supersede rule (`artifacts_proto` /
# `blobs::ArtifactEntry`). A raw-string timestamp compare sorts mixed fractional
# precision / offsets wrong, so a real parse is required. Same workspace pin
# `notes-crdt` already uses for the lifecycle merge, so the two agree.
chrono = { workspace = true }
# futures-util — `StreamExt::next()` over `iroh_blobs`' download-progress stream
# (`blobs::download_capped`), so a blob pull can be watched byte-by-byte and cut
# off once it crosses the per-blob size cap, rather than only checked after the
# whole (potentially oversized) transfer has already landed on disk.
futures-util = { workspace = true }

[features]
# Exposes the relay-less direct-connection path (`SyncEngine::start_direct` +
# `bound_sockets`) and the insecure-relay-TLS path (`SyncEngine::start_insecure`,
# needing `dep:iroh-relay`) for integration tests and local bring-up. NOT
# enabled in the production build, whose sync surface always pins the relay and
# verifies its certificate.
test-support = ["dep:iroh-relay"]

[dev-dependencies]
# Self-dependency with `test-support` on so `cargo test -p sync` builds the
# integration test against the relay-less path without a feature flag on the
# command line.
sync = { path = ".", features = ["test-support"] }
# persistence: the integration tests round-trip note-image assets through
# `persistence::assets` (`save_note_asset` / `read_note_asset`), which stays in
# `persistence`. A dev-only edge — the production `sync` lib depends only on
# `common` + `notes-crdt`, so the C-heavy graph never enters its compile path.
persistence = { path = "../persistence" }
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# `test-utils` exposes `iroh::test_utils::run_relay_server`, an in-process relay
# (AllowAll access, no token required) that lets `relay_live` prove the relay-only
# addressing path without the deployed `sync.minutist.ai` relay. Dev-only: the
# production build never links this feature. Same exact pin as `[dependencies]`
# so the two `iroh` builds in a test binary are the same crate.
iroh = { version = "=1.0.0", features = ["test-utils"] }
