[package]
name = "tunnel-client"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

# WS4-A S5b: the app-side account client for the connected tier — device-code
# pairing (RFC 8628) plus the account device-directory HTTP client. A near-leaf:
# it takes no workspace edge. Part of the CONNECTED feature surface: the crate
# lives in the workspace unconditionally (like `mcp-server`) but `app-main`'s
# edge to it is only wired behind the `connected` feature in S5 (`headless`'s
# edge is unconditional — a seeded hub is always account-capable).

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
# The device-code pairing client and the account-directory client, both against
# the account-service. Reuses the workspace reqwest (rustls) with the `json`
# feature for their small request/response bodies.
reqwest = { workspace = true, features = ["json"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "io-util", "net", "signal"] }
# Account-directory client tests (B4) stand up a mock account-service to pin the
# GET/PUT wire contract; serde_json builds the response bodies + asserts the PUT body.
wiremock = "0.6"
serde_json = { workspace = true }
