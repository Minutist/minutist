# deny.toml — cargo-deny configuration for the Minutist workspace.
#
# Run: cargo deny check
# CI:  EmbarkStudios/cargo-deny-action in test.yml
#
# [licenses] covers every licence that appears in the dependency tree as
# returned by `cargo deny list` (2026-06-12).  Only OSI-/FSF-free licences
# are listed; anything unexpected must be investigated rather than rubber-
# stamped.  Notes on the non-obvious entries:
#
#   BSL-1.0       Boost Software License 1.0 — OSI-approved permissive.
#   CC0-1.0       Public-domain dedication (dunce) — permissive, acceptable.
#   CDLA-Permissive-2.0
#                 Community Data License Agreement Permissive 2.0.  Used by
#                 webpki-root-certs / webpki-roots (Mozilla CA certificates).
#                 Not OSI-approved but explicitly permissive for software use;
#                 Mozilla + rustls projects treat it as equivalent to MIT/Apache
#                 for CA-bundle distribution.  Accepted here on that basis.
#   LGPL-2.1-or-later
#                 GNU Lesser General Public License — used by r-efi (UEFI
#                 bindings), a transitive dep of some Windows crates.  LGPL is
#                 FSF-free and, for a dynamically-linked shared library, does
#                 not require the application itself to be GPL.  Accepted.
#   MIT-0         MIT No Attribution — public-domain-equivalent (dunce).
#   Unlicense     Public-domain dedication — permissive, acceptable.

# Throwaway spike crates (spikes/*) are excluded from the crate graph: they are
# scratch experiments that never ship (CLAUDE.local.md), so their dependencies
# should not gate CI on advisories or licences.  This is FORWARD-LOOKING hygiene,
# not a current fix: today it is a no-op for all four legs (removing this list
# still passes), because the crates unique to the spikes — e.g. pdfium-render via
# spike-doc-vlm — carry clean (MIT/Apache) licences and no active advisory.  The
# licence rejections that were cleared came from the zip/image feature trims, not
# from this exclusion.  Crates a real application crate also depends on are
# unaffected — exclude only removes a crate and the dependencies unique to it.
# Latent caveat (accepted per policy): a future spike dep with a GPL/denied
# licence or a live advisory will NOT gate CI while it is spike-only.  If a spike
# is ever promoted to a real crate, remove it from this list so its dependencies
# re-enter the graph and are audited.
exclude = [
    "spike-asr",
    "spike-llm",
    "spike-vad-loop",
    "spike-diarize",
    "spike-doc-vlm",
]

[graph]
# Resolve the full workspace to catch every crate's licence, but only check
# the crates that actually make it into a build (no [dev-dependencies]-only
# pull-ins that never ship).
targets = []
all-features = false

[licenses]
# Minimum confidence threshold for licence detection via SPDX text matching.
confidence-threshold = 0.8

allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "AGPL-3.0-only",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "LGPL-2.1-or-later",
]

# Licences that carry copyleft obligations require explicit review.  If a new
# GPL-* dep appears cargo-deny will error — investigate before adding it here.

[[licenses.clarify]]
# ryu is dual-licensed Apache-2.0 / BSL-1.0; the Cargo metadata lists only
# BSL-1.0 in some versions.  Apache-2.0 is the effective choice for this
# project.
name = "ryu"
expression = "Apache-2.0 OR BSL-1.0"
license-files = [{ path = "LICENSE-APACHE", hash = 0x1f9c0e71 }]

[advisories]
# Deny crates with known security vulnerabilities in the RustSec database.
# Advisories for transitive dependencies with no safe upgrade path are ignored
# below rather than failing CI.  Most entries are unmaintained (not
# vulnerability) advisories; the exceptions are individually justified inline
# (a dev-only dependency, or a risk accepted for a local-first single-user
# desktop app).  Each ignore states its reachability so a red cargo-deny is
# never used to mask a genuinely reachable runtime vulnerability.
version = 2
ignore = [
    # gtk-rs GTK3 — transitive via Tauri/libappindicator.  Archived upstream;
    # no gtk4 alternative in the Tauri 2.x dep tree yet.
    "RUSTSEC-2024-0411",  # gdkwayland-sys
    "RUSTSEC-2024-0412",  # gdk
    "RUSTSEC-2024-0413",  # atk
    "RUSTSEC-2024-0414",  # gdkx11-sys
    "RUSTSEC-2024-0415",  # gtk
    "RUSTSEC-2024-0416",  # atk-sys
    "RUSTSEC-2024-0417",  # gdkx11
    "RUSTSEC-2024-0418",  # gdk-sys
    "RUSTSEC-2024-0419",  # gtk3-macros
    "RUSTSEC-2024-0420",  # gtk-sys
    # audiopus_sys — our audio stack uses audiopus 0.3.0-rc.0.  No maintained
    # fork; CMake 4.0 compat issue does not affect our build.
    "RUSTSEC-2026-0150",
    # paste — transitive via several macro crates; no maintained alternative.
    "RUSTSEC-2024-0436",
    # proc-macro-error — transitive via bindgen and other macro crates.
    "RUSTSEC-2024-0370",
    # unic-* — transitive via markup5ever/html5ever (in Tauri's HTML parser).
    "RUSTSEC-2025-0075",  # unic-char-range
    "RUSTSEC-2025-0080",  # unic-common
    "RUSTSEC-2025-0081",  # unic-char-property
    "RUSTSEC-2025-0098",  # unic-ucd-version
    "RUSTSEC-2025-0100",  # unic-ucd-ident
    # atomic-polyfill — transitive via postcard -> heapless 0.7, the frame codec
    # used by iroh / iroh-blobs / iroh-tickets / tunnel-client.  Unmaintained;
    # heapless 0.8 dropped atomic-polyfill but postcard 1.1 pins heapless 0.7, so
    # there is no safe upgrade path from our side.
    "RUSTSEC-2023-0089",  # atomic-polyfill
    # lopdf stack overflow on deeply-nested PDF objects — DEV-ONLY.
    # `cargo tree -e no-dev -i lopdf` is empty: lopdf is reachable only via
    # printpdf, a [dev-dependencies] of doc-convert, and is not in the shipped
    # binary (the runtime PDF path is pdf_oxide).  Not an exploitable surface.
    "RUSTSEC-2026-0187",  # lopdf
    # ttf-parser — author-declared unmaintained (not a vulnerability), no safe
    # upgrade.  Runtime-reachable via pdf_oxide -> doc-convert (attachments), so
    # unlike the entries above it is not dev-only; tracked for a skrifa
    # migration.  Ignored on the same basis as the other unmaintained crates.
    "RUSTSEC-2026-0192",  # ttf-parser
    # quick-xml <0.41 — quadratic duplicate-attribute scan (-0194) and unbounded
    # NsReader namespace-declaration allocation (-0195), both DoS.  Every
    # RUNTIME path is closed by upgrading its requirer to a quick-xml-0.41
    # release, not by ignoring a reachable version:
    #   - doc-convert's direct OOXML walk -> workspace pin raised to 0.41.
    #   - calamine (XLSX/ODS attachments) -> bumped 0.35 -> 0.36 (pulls 0.41).
    #   - pdf_oxide / office_oxide (PDF/office attachments) -> 0.3.74 / 0.1.6.
    #   - plist -> tauri-utils -> tauri runtime -> bumped plist 1.9 -> 1.10
    #     (pulls 0.41).
    # After those, `cargo tree -e no-dev,no-build -i quick-xml@0.36.2` is empty:
    # the only quick-xml <0.41 left is 0.36.2, pulled solely by docx-rs, a
    # [dev-dependencies] of doc-convert (a test-fixture .docx writer) — not in
    # the shipped binary.  Drop these two ignores when docx-rs ships a release
    # on quick-xml >=0.41 (none exists yet).
    "RUSTSEC-2026-0194",  # quick-xml 0.36.2 (dev-only, docx-rs fixture writer)
    "RUSTSEC-2026-0195",  # quick-xml 0.36.2 (dev-only, docx-rs fixture writer)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # vad-rs is pinned to an exact commit SHA; no crates.io release exists.
    # See workspace Cargo.toml for the rationale.
    "https://github.com/cjpais/vad-rs",
]

[bans]
# Warn (not error) on multiple versions of the same crate: the tree has
# intentional duplication (e.g. windows-sys 0.45/0.48/0.52/0.59/0.60/0.61)
# from the Tauri/hyper/reqwest/sherpa-rs stack.  Erroring on every duplicate
# would generate noise without actionable remediation.
multiple-versions = "warn"

# Backstop for the RUSTSEC-2026-0194/-0195 advisory ignores above.  Those
# ignores are ID-scoped, not path-scoped, so they silently cover ANY quick-xml
# <0.41 in the tree — they actually rest on the invariant "the only quick-xml
# <0.41 is the dev-only docx-rs fixture writer".  This ban enforces exactly that
# invariant: quick-xml <0.41 is denied unless its direct wrapper is docx-rs, so
# any dependency that reintroduces a runtime (or any non-docx-rs) quick-xml <0.41
# fails the bans leg — which the advisory ignore cannot catch.  Drop this ban
# together with the two advisory ignores when docx-rs ships on quick-xml >=0.41.
[[bans.deny]]
name = "quick-xml"
version = "<0.41"
wrappers = ["docx-rs"]
