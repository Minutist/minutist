[package]
name = "meeting-app"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "meeting_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "meeting-app"
path = "src/main.rs"

[[bin]]
name = "generate-bindings"
path = "src/bin/generate-bindings.rs"

[features]
# GPU acceleration backends (Phase 7), OFF by default → the default build is
# CPU-only and needs no GPU SDK. Forwarded to ipc-bridge, the single fan-out
# point over every ML crate (summariser + orchestrator's asr + diarizer).
# CI selects one per platform: `cargo build --features vulkan` (Windows/Linux),
# `--features metal` (macOS). See architecture/cross-cutting.md "GPU portability".
vulkan = ["ipc-bridge/vulkan"]
metal = ["ipc-bridge/metal"]
rocm = ["ipc-bridge/rocm"]
cuda = ["ipc-bridge/cuda"]
directml = ["ipc-bridge/directml"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
meeting-app-common = { path = "../crates/common" }
ipc-bridge = { path = "../crates/ipc-bridge" }
orchestrator = { path = "../crates/orchestrator" }
model-registry = { path = "../crates/model-registry" }
agent-tools = { path = "../crates/agent-tools" }
mcp-server = { path = "../crates/mcp-server" }
settings = { path = "../crates/settings" }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-fs = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-specta = { workspace = true }
specta-typescript = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Phase 10: high-entropy MCP bearer-token generation (256-bit, hex-encoded).
rand = { workspace = true }
hex = { workspace = true }
