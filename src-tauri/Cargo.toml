[package]
name = "minutist"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "minutist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "minutist"
path = "src/main.rs"

[[bin]]
name = "generate-bindings"
path = "src/bin/generate-bindings.rs"

[features]
# GPU acceleration backends (Phase 7), OFF by default → the default build is
# CPU-only and needs no GPU SDK. Forwarded to ipc-bridge, the single fan-out
# point over every ML crate (summariser + orchestrator's asr + diarizer).
# CI selects one per platform: `cargo build --features vulkan` (Windows/Linux),
# `--features metal` (macOS). See architecture/cross-cutting.md "GPU portability".
vulkan = ["ipc-bridge/vulkan"]
metal = ["ipc-bridge/metal"]
rocm = ["ipc-bridge/rocm"]
cuda = ["ipc-bridge/cuda"]
directml = ["ipc-bridge/directml"]

# Connected tier (Phase 10): in-process MCP server, bearer-token generation.
# ON by default so `cargo build` / `cargo run` retain current behaviour.
# The free artifact is built with --no-default-features (plus an explicit GPU
# feature when needed, e.g. --no-default-features --features vulkan).
# See architecture/cross-cutting.md "Build variants".
connected = ["dep:mcp-server", "dep:tunnel-client", "dep:sync", "dep:election", "dep:async-trait", "dep:rand", "dep:hex"]
default = ["connected"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
minutist-common = { path = "../crates/common" }
ipc-bridge = { path = "../crates/ipc-bridge" }
orchestrator = { path = "../crates/orchestrator" }
model-registry = { path = "../crates/model-registry" }
agent-tools = { path = "../crates/agent-tools" }
mcp-server = { path = "../crates/mcp-server", optional = true }
# WS4-A S5b: the app-side relay tunnel (pairing + reconnect + lifecycle). Part
# of the connected feature surface — the free build omits it (no relay).
tunnel-client = { path = "../crates/tunnel-client", optional = true }
# WS4-B S5: device-to-device notes sync (iroh endpoint + the notes-update
# protocol). The ConnectedSync impl of ipc_bridge::SyncControl is backed by this
# crate. Part of the connected feature surface — the free build omits it.
sync = { path = "../crates/sync", optional = true }
# WS4-B producer-gate S4: the host-election state machine. The DesktopElectionDriver
# (in `sync.rs`, connected-gated) wires it to the SyncEngine + Orchestrator. Part of
# the connected feature surface — the free build omits it.
election = { path = "../crates/election", optional = true }
settings = { path = "../crates/settings" }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-fs = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-specta = { workspace = true }
specta-typescript = { workspace = true }
tokio = { workspace = true }
# tokio_util::sync::CancellationToken — the shared cancel for the peers-poll and
# account-refresh-loop v2 (issue 0029 item 1). Matches the `sync` crate's pin.
tokio-util = "0.7"
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Phase 10: high-entropy MCP bearer-token generation (256-bit, hex-encoded).
# Optional: only compiled in the `connected` build.
rand = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
# WS4-A S5b: the ConnectedTunnel impl of ipc_bridge::TunnelControl is an
# async-trait. Optional — only the connected build builds the tunnel module.
async-trait = { workspace = true, optional = true }

[dev-dependencies]
# Unit tests for the connected tunnel module (credential 0600 round-trip).
tempfile = "3"
# E2E test for the connected sync module (`sync.rs`): seeds meetings on disk and
# projects the converged notes/media for comparison, mirroring the engine-level
# `crates/sync/tests/{relay_live,blobs_live}.rs`. Test-only — app-main's
# production code reaches `persistence` through `ipc-bridge`, never directly, so
# this dev-dependency adds no runtime edge to the dependency table.
persistence = { path = "../crates/persistence" }
# Same test-only rationale as `persistence` above: `sync.rs`'s tests read
# `NotesStore` / `MeetingFolder` / `ydoc` directly from the leaf.
notes-crdt = { path = "../crates/notes-crdt" }
